version: '3.8'

services:
  # PostgreSQL database for local testing
  postgres:
    image: postgres:15-alpine
    container_name: tota_postgres
    environment:
      POSTGRES_DB: tota_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # LinkedIn microservice
  linkedin-service:
    build: .
    container_name: tota_linkedin_service
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/tota_db
      - RAPIDAPI_KEY=${RAPIDAPI_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src/cache:/app/src/cache

volumes:
  postgres_data:
