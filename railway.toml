[build]
builder = "nixpacks"

[deploy]
startCommand = "npm start"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

# Specify Bun as the runtime and build environment
[build.environment]
BUN_VERSION = "1.2.19"
NIXPACKS_NODE_VERSION = "18"

# Override the default build commands for Bun
[build.nixpacks]
startCmd = "bun run start"
installCmd = "curl -fsSL https://bun.sh/install | bash"
buildCmd = "echo 'Bun project - no build step needed'"

[[services]]
name = "linkedin-sync-service"

# Environment variables that need to be set in Railway dashboard
# DATABASE_URL - Railway PostgreSQL connection string
# RAPIDAPI_KEY - Your RapidAPI key for LinkedIn data
# PORT - Railway sets this automatically


